name: acceptance (preprod)

# Runs the cross-service Cucumber suite against a running preprod environment.
# Intended to be called by each service's PR pipeline as a REQUIRED check before
# merging that service into main (see README "Merge gating").
on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Gateway base URL of the preprod environment
        required: true
  workflow_call:
    inputs:
      gateway_url:
        description: Gateway base URL of the preprod environment
        required: true
        type: string

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run acceptance suite against preprod
        env:
          SHOP_GATEWAY_URL: ${{ inputs.gateway_url }}
        run: gradle test
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: build/reports/tests/test
